<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dyżury OIT - System Planowania</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; font-size: 11px; }
      .print-border { border: 1px solid #cbd5e1 !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <header class="bg-blue-900 text-white shadow-md no-print sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-hospital-user text-2xl text-blue-300"></i>
        <div>
          <h1 class="font-bold text-lg leading-tight">OIT Grafik Dyżurów</h1>
          <p class="text-xs text-blue-200">System deklaracji i planowania obsady</p>
        </div>
      </div>
      
      <nav class="flex space-x-1 bg-blue-950 p-1 rounded-lg text-sm">
        <button id="nav-doctor" onclick="switchView('doctor')" class="px-3 py-1.5 rounded-md font-medium bg-blue-600 text-white transition">
          <i class="fa-regular fa-calendar-check mr-1"></i> Moja Dyspozycja
        </button>
        <button id="nav-schedule" onclick="switchView('schedule')" class="px-3 py-1.5 rounded-md font-medium text-blue-200 hover:text-white transition">
          <i class="fa-solid fa-calendar-days mr-1"></i> Grafik Oddziału
        </button>
        <button id="nav-admin" onclick="openAdminAuth()" class="px-3 py-1.5 rounded-md font-medium text-blue-200 hover:text-white transition">
          <i class="fa-solid fa-lock mr-1"></i> Panel Admina
        </button>
      </nav>
    </div>
  </header>

  <div id="toast" class="fixed bottom-5 right-5 z-50 transform transition-all duration-300 translate-y-20 opacity-0 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-xl flex items-center space-x-3">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toast-msg" class="text-sm">Komunikat</span>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- WIDOK 1: DEKLARACJA LEKARZA -->
    <section id="view-doctor" class="space-y-6">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
        <div class="w-full md:w-auto">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Wybierz swoje nazwisko</label>
          <select id="doctor-select" onchange="handleDoctorChange()" class="w-full md:w-80 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-800 font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">-- Wybierz lekarza z listy --</option>
          </select>
        </div>

        <div class="flex items-center space-x-2">
          <button onclick="changeMonth(-1)" class="p-2 border rounded-lg hover:bg-slate-50 text-slate-600"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="calendar-month-label" class="font-bold text-base px-3 text-slate-700 min-w-[140px] text-center">Miesiąc</span>
          <button onclick="changeMonth(1)" class="p-2 border rounded-lg hover:bg-slate-50 text-slate-600"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <div class="flex flex-wrap gap-2 text-xs">
          <span class="inline-flex items-center px-2.5 py-1 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">
            <span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span> Preferowany (Chcę)
          </span>
          <span class="inline-flex items-center px-2.5 py-1 rounded bg-blue-50 text-blue-700 border border-blue-200">
            <span class="w-2 h-2 rounded-full bg-blue-500 mr-1.5"></span> Dostępny (Mogę)
          </span>
          <span class="inline-flex items-center px-2.5 py-1 rounded bg-rose-50 text-rose-700 border border-rose-200">
            <span class="w-2 h-2 rounded-full bg-rose-500 mr-1.5"></span> Niedostępny
          </span>
        </div>
      </div>

      <div class="bg-blue-50 border-l-4 border-blue-600 p-4 rounded-r-lg text-sm text-blue-900 flex items-start space-x-3">
        <i class="fa-solid fa-info-circle text-blue-600 text-lg mt-0.5">
